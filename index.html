<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Orbit · Server Control</title>
    <style>
      html, body { background: #000000; color: #f5f5f5; margin: 0; }
      html[data-theme="light"], html[data-theme="light"] body { background: #f2f5f7; color: #1a1d21; }
    </style>
    <script>
      try {
        var a = JSON.parse(localStorage.getItem('orbit.appearance') || '{}');
        var root = document.documentElement;
        root.dataset.theme = a.theme === 'light' ? 'light' : 'dark';
        root.dataset.nav = a.navLayout === 'dock' ? 'dock' : 'sidebar';
        root.dataset.sidebar = a.sidebarCollapsed ? 'collapsed' : 'expanded';
        var accents = {
          orange: ['#ff7a1a','#ff9a4d','255, 122, 26'],
          red: ['#ef4444','#f87171','239, 68, 68'],
          rose: ['#f43f5e','#fb7185','244, 63, 94'],
          amber: ['#f59e0b','#fbbf24','245, 158, 11'],
          lime: ['#84cc16','#a3e635','132, 204, 22'],
          green: ['#22c55e','#4ade80','34, 197, 94'],
          teal: ['#14b8a6','#2dd4bf','20, 184, 166'],
          cyan: ['#06b6d4','#22d3ee','6, 182, 212'],
          blue: ['#3b82f6','#60a5fa','59, 130, 246'],
          violet: ['#8b5cf6','#a78bfa','139, 92, 246']
        };
        var c = accents[a.accent] || accents.orange;
        root.style.setProperty('--accent', c[0]);
        root.style.setProperty('--accent-2', c[1]);
        root.style.setProperty('--accent-rgb', c[2]);
        root.style.setProperty('--accent-dim', 'rgba(' + c[2] + ', 0.14)');
        root.style.setProperty('--line-strong', 'rgba(' + c[2] + ', 0.45)');
        root.dataset.accent = a.accent && accents[a.accent] ? a.accent : 'orange';
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', a.theme === 'light' ? '#f2f5f7' : '#000000');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
