<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#07080d" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Orbit · Server Control</title>
    <style>
      html, body { background: #07080d; color: #eef0ff; margin: 0; }
      html[data-theme="light"], html[data-theme="light"] body { background: #f3f4f9; color: #11132a; }
    </style>
    <script>
      try {
        var a = JSON.parse(localStorage.getItem('orbit.appearance') || '{}');
        var root = document.documentElement;
        root.dataset.theme = a.theme === 'light' ? 'light' : 'dark';
        root.dataset.sidebar = a.sidebarCollapsed ? 'collapsed' : 'expanded';
        var light = a.theme === 'light';
        var accents = {
          nebula: ['#7c6cff','#a597ff','124, 108, 255','#3fd0ff','#5b49f0','91, 73, 240','#0ea5e9'],
          aurora: ['#1fd1c1','#62eadb','31, 209, 193','#7c6cff','#0d9488','13, 148, 136','#6d5ae6'],
          ocean: ['#4c8dff','#82b0ff','76, 141, 255','#22d3ee','#1d5fe0','29, 95, 224','#0891b2'],
          plasma: ['#d44bff','#e48cff','212, 75, 255','#ff5fa2','#a21caf','162, 28, 175','#db2777'],
          rose: ['#ff4f7b','#ff8aa6','255, 79, 123','#ffa34d','#d61f50','214, 31, 80','#ea7a12'],
          ember: ['#ff7a1a','#ffa057','255, 122, 26','#ffcf4d','#c45a10','196, 90, 16','#ca8a04'],
          solar: ['#f5b70a','#ffd256','245, 183, 10','#ff7a1a','#a16207','161, 98, 7','#c2410c'],
          mint: ['#2ee59d','#7ff0c2','46, 229, 157','#3fd0ff','#059669','5, 150, 105','#0284c7']
        };
        var id = Number(a.v) >= 3 && accents[a.accent] ? a.accent : 'nebula';
        var c = accents[id];
        var hex = light ? c[4] : c[0], rgb = light ? c[5] : c[2];
        root.style.setProperty('--accent', hex);
        root.style.setProperty('--accent-2', c[1]);
        root.style.setProperty('--accent-rgb', rgb);
        root.style.setProperty('--accent-dim', 'rgba(' + rgb + ', 0.14)');
        root.style.setProperty('--accent-ink', light ? hex : c[1]);
        root.style.setProperty('--brand-b', light ? c[6] : c[3]);
        root.dataset.accent = id;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', light ? '#f3f4f9' : '#07080d');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
