<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Orbit · Server Control</title>
    <style>
      html, body { background: #000000; color: #f5f5f5; margin: 0; }
      html[data-theme="light"], html[data-theme="light"] body { background: #f4f4f5; color: #18181b; }
    </style>
    <script>
      try {
        var a = JSON.parse(localStorage.getItem('orbit.appearance') || '{}');
        var root = document.documentElement;
        root.dataset.theme = a.theme === 'light' ? 'light' : 'dark';
        root.dataset.sidebar = a.sidebarCollapsed ? 'collapsed' : 'expanded';
        var light = a.theme === 'light';
        var accents = {
          orange: ['#ff7a1a','#ff9a4d','255, 122, 26','#c45a10','196, 90, 16','#0a0a0a'],
          red: ['#ef4444','#f87171','239, 68, 68','#c53030','197, 48, 48','#ffffff'],
          rose: ['#f43f5e','#fb7185','244, 63, 94','#be123c','190, 18, 60','#ffffff'],
          amber: ['#f59e0b','#fbbf24','245, 158, 11','#b45309','180, 83, 9','#0a0a0a'],
          lime: ['#84cc16','#a3e635','132, 204, 22','#4d7c0f','77, 124, 15','#0a0a0a'],
          green: ['#22c55e','#4ade80','34, 197, 94','#15803d','21, 128, 61','#0a0a0a'],
          teal: ['#14b8a6','#2dd4bf','20, 184, 166','#0f766e','15, 118, 110','#0a0a0a'],
          cyan: ['#06b6d4','#22d3ee','6, 182, 212','#0e7490','14, 116, 144','#0a0a0a'],
          blue: ['#3b82f6','#60a5fa','59, 130, 246','#1d4ed8','29, 78, 216','#ffffff'],
          violet: ['#8b5cf6','#a78bfa','139, 92, 246','#6d28d9','109, 40, 217','#ffffff']
        };
        var id = accents[a.accent] ? a.accent : 'orange';
        var c = accents[id];
        var hex = light ? c[3] : c[0], rgb = light ? c[4] : c[2];
        root.style.setProperty('--accent', hex);
        root.style.setProperty('--accent-2', c[1]);
        root.style.setProperty('--accent-rgb', rgb);
        root.style.setProperty('--accent-dim', 'rgba(' + rgb + ', 0.14)');
        root.style.setProperty('--accent-ink', light ? hex : c[1]);
        root.style.setProperty('--accent-fg', light ? '#ffffff' : c[5]);
        root.dataset.accent = id;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', light ? '#f4f4f5' : '#000000');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
